name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v0.1.0)"
        required: false
        default: "v0.1.0-dev"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Build Rust Solver for all platforms ──────────────────────────────
  build-solver:
    name: Build Solver - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: sumzle-solver-windows-x64
            ext: ".exe"

          # Windows ARM64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: sumzle-solver-windows-arm64
            ext: ".exe"

          # macOS Intel
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: sumzle-solver-macos-x64
            ext: ""

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: sumzle-solver-macos-arm64
            ext: ""

          # Linux x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: sumzle-solver-linux-x64
            ext: ""

          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: sumzle-solver-linux-arm64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "mini-services/sumzle-solver -> target"
          key: ${{ matrix.target }}

      # Install cross-compilation dependencies for Linux ARM64
      - name: Install ARM64 cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build Rust solver
        working-directory: mini-services/sumzle-solver
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUST_MIN_STACK: 16777216

      - name: Strip binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          BINARY="mini-services/sumzle-solver/target/${{ matrix.target }}/release/sumzle-solver${{ matrix.ext }}"
          if [ -f "$BINARY" ]; then
            strip "$BINARY" 2>/dev/null || echo "strip not available or failed, continuing..."
          fi

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp mini-services/sumzle-solver/target/${{ matrix.target }}/release/sumzle-solver${{ matrix.ext }} dist/
          cp mini-services/sumzle-solver/Cargo.toml dist/
          cp -r mini-services/sumzle-solver/src dist/src
          chmod +x dist/sumzle-solver${{ matrix.ext }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy mini-services\sumzle-solver\target\${{ matrix.target }}\release\sumzle-solver${{ matrix.ext }} dist\
          copy mini-services\sumzle-solver\Cargo.toml dist\
          xcopy mini-services\sumzle-solver\src dist\src\ /E /I

      - name: Upload solver artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          retention-days: 30

  # ─── Build Next.js frontend ──────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Build Next.js
        run: bun run build
        env:
          NEXT_PUBLIC_SOLVER_URL: ""

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: .next/
          retention-days: 30

  # ─── Create GitHub Release ───────────────────────────────────────────
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-solver, build-frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | head -30

      - name: Create distribution archives
        run: |
          mkdir -p release

          # Package each solver binary
          for dir in artifacts/sumzle-solver-*/; do
            name=$(basename "$dir")
            echo "Packaging $name..."

            if [[ "$name" == *windows* ]]; then
              cd "$dir"
              zip -r "${GITHUB_WORKSPACE}/release/${name}.zip" .
              cd "${GITHUB_WORKSPACE}"
            else
              tar -czf "release/${name}.tar.gz" -C "$dir" .
            fi
          done

          # Package frontend
          tar -czf release/frontend-dist.tar.gz -C artifacts/frontend-dist/ .

          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Sumzle HP Solver ${{ github.ref_name }}
          body: |
            ## Sumzle HP Solver - ${{ github.ref_name }}

            ### Downloads
            | Platform | Architecture | File |
            |----------|-------------|------|
            | Windows | x64 | `sumzle-solver-windows-x64.zip` |
            | Windows | ARM64 | `sumzle-solver-windows-arm64.zip` |
            | macOS | Intel | `sumzle-solver-macos-x64.tar.gz` |
            | macOS | Apple Silicon | `sumzle-solver-macos-arm64.tar.gz` |
            | Linux | x64 | `sumzle-solver-linux-x64.tar.gz` |
            | Linux | ARM64 | `sumzle-solver-linux-arm64.tar.gz` |

            ### Usage
            1. Download the solver binary for your platform
            2. Download the frontend distribution (`frontend-dist.tar.gz`)
            3. Start the solver: `RUST_MIN_STACK=16777216 ./sumzle-solver`
            4. Start the frontend: `bun run start`
            5. Open http://localhost:3000

            ### What's New
            - High-performance Rust solver engine
            - Next.js 16 frontend with full constraint board
            - Multi-core parallel search
            - Distributed computing support
            - Full result download (JSON/CSV/TXT)
            - Smart hints and probability analysis
          files: release/*
          draft: false
          prerelease: false
