name: CI - Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Frontend Lint & Type Check ─────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Run ESLint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit --project tsconfig.json 2>&1 | grep -v "examples/" | grep -v "skills/" || true

  # ─── Rust Build & Test (native on each OS) ────────────────────────────
  rust-build-test:
    name: Rust Build & Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        working-directory: mini-services/sumzle-solver
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "mini-services/sumzle-solver -> target"

      - name: Check formatting
        run: cargo fmt -- --check
        continue-on-error: true

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        continue-on-error: true

      - name: Build (release)
        run: cargo build --release
        env:
          RUST_MIN_STACK: 16777216

      - name: Run tests
        run: cargo test --release
        env:
          RUST_MIN_STACK: 16777216

  # ─── Rust Cross-Compilation Build Test (Linux ARM64 from x64) ─────────
  rust-cross-build-arm64:
    name: Rust Cross-Build - Linux ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "mini-services/sumzle-solver -> target"
          key: aarch64-unknown-linux-gnu

      - name: Install ARM64 cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Cross-compile build (aarch64-unknown-linux-gnu)
        working-directory: mini-services/sumzle-solver
        run: cargo build --release --target aarch64-unknown-linux-gnu
        env:
          RUST_MIN_STACK: 16777216

  # ─── Frontend Build Test ───────────────────────────────────────────────
  frontend-build:
    name: Frontend Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Build Next.js
        run: npx next build
        env:
          NEXT_PUBLIC_SOLVER_URL: ""

      - name: Verify build output
        run: |
          echo "=== .next/ directory ==="
          ls -la .next/ || echo "No .next directory found!"
          echo "=== Standalone output ==="
          ls -la .next/standalone/ 2>/dev/null || echo "No standalone output (may not be configured)"

  # ─── Integration Test ──────────────────────────────────────────────────
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [rust-build-test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "mini-services/sumzle-solver -> target"

      - name: Build Rust solver
        run: cargo build --release --manifest-path mini-services/sumzle-solver/Cargo.toml
        env:
          RUST_MIN_STACK: 16777216

      - name: Start Rust solver in background
        run: |
          RUST_MIN_STACK=16777216 ./mini-services/sumzle-solver/target/release/sumzle-solver &
          sleep 3

      - name: Verify solver health
        run: |
          RESPONSE=$(curl -s http://127.0.0.1:3031/api/health)
          echo "Health response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['success'], 'Health check failed'; print('Solver is healthy')"

      - name: Test basic solve (1+1=2)
        run: |
          RESPONSE=$(curl -s -X POST http://127.0.0.1:3031/api/solve/parallel \
            -H "Content-Type: application/json" \
            -d '{"length":5,"rows":[[{"char":"1","state":"correct"},{"char":"+","state":"correct"},{"char":"1","state":"correct"},{"char":"=","state":"correct"},{"char":"2","state":"correct"}]],"mode":"parallel"}')
          echo "Solve response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          assert d['success'], f'Solve failed: {d.get(\"error\", \"unknown\")}'
          results = d['data']['results']
          assert '1+1=2' in results, f'1+1=2 not in results: {results}'
          print(f'Integration test passed! Found {len(results)} result(s)')
          "

      - name: Test solve with absent states
        run: |
          RESPONSE=$(curl -s -X POST http://127.0.0.1:3031/api/solve/parallel \
            -H "Content-Type: application/json" \
            -d '{"length":5,"rows":[[{"char":"1","state":"correct"},{"char":"-","state":"absent"},{"char":"1","state":"correct"},{"char":"=","state":"correct"},{"char":"2","state":"correct"}]],"mode":"parallel"}')
          echo "Solve with absent response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          assert d['success'], f'Solve failed: {d.get(\"error\", \"unknown\")}'
          results = d['data']['results']
          for r in results:
            assert '-' not in r, f'Found absent operator in result: {r}'
          print(f'Absent state test passed! Found {len(results)} result(s)')
          "

      - name: Test solve with empty constraints
        run: |
          RESPONSE=$(curl -s -X POST http://127.0.0.1:3031/api/solve/parallel \
            -H "Content-Type: application/json" \
            -d '{"length":6,"rows":[],"mode":"parallel","max_results":100}')
          echo "Empty constraints response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          assert d['success'], f'Solve failed: {d.get(\"error\", \"unknown\")}'
          results = d['data']['results']
          assert len(results) > 0, 'No results returned for empty constraints'
          print(f'Empty constraints test passed! Found {len(results)} result(s)')
          "

      - name: Stop solver
        if: always()
        run: pkill -f sumzle-solver || true
